name: pulse_campus
description: Pulse — Campus Smart ID System. Scan Fast. Work Offline. Stay Accurate.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  supabase_flutter: ^2.3.4
  mobile_scanner: ^3.5.6
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  file_picker: ^8.1.2
  excel: ^4.0.2
  connectivity_plus: ^5.0.2
  flutter_animate: ^4.5.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  isar_generator: ^3.1.0+1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true